<!DOCTYPE html>
<html>
<head>
    <title>Job Recommendation System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            text-align: center;
            padding-top: 60px;
        }

        .container {
            background: white;
            padding: 25px;
            margin: auto;
            width: 40%;
            border-radius: 12px;
            box-shadow: 0px 0px 15px gray;
        }

        h2 {
            color: #333;
        }

        input {
            padding: 10px;
            width: 70%;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #d4edda;
            margin: 8px;
            padding: 10px;
            border-radius: 5px;
        }

        .note {
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>💼 Job Recommendation System</h2>

    <form method="POST">
        <input type="text" name="skills" placeholder="Enter skills (Python, HTML, Java)">
        <br>
        <button type="submit">Get Recommendations</button>
    </form>

    <h3>Recommended Jobs:</h3>
    <p class="note">Based on your skills, here are your job options:</p>

    <ul>
        {% for job in jobs %}
            <li>{{ job }}</li>
        {% endfor %}
    </ul>
</div>

</body>
</html>s
